name: tests

on:
  push:
    branches: ["master"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["master"]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.github/actions/fluentci-toolchain
      - name: Set up Rust
        run: fluentci run setup-rust setup --toolchain 1.98.0 --components llvm-tools-preview,clippy | node .fluentci/github-env.mjs
      - run: fluentci run ci dependencies
      - name: Run workspace tests with coverage
        run: fluentci run ci coverage
      - name: Set up Codecov
        run: fluentci run setup-codecov setup | node .fluentci/github-env.mjs
      - name: Upload to Codecov
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          COVERAGE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: fluentci run ci codecov --report artifacts/lcov.info --commit "$COVERAGE_COMMIT" --flag ""

name: tests

on:
  push:
    branches: ["master"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vendor DuckDB
        # `libduckdb-sys` resolves `-l static=duckdb_static` when its own crate
        # compiles, and Cargo gives no way to order another crate's build script
        # ahead of that — so the libraries must be on disk before cargo runs at
        # all. See scripts/fetch-duckdb.sh.
        run: ./scripts/fetch-duckdb.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component llvm-tools
          rustup default 1.98.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-ci-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev pkg-config protobuf-compiler libfontconfig1-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov
          fallback: none

      - name: Build webui
        run: |
          cd webui/musicplayer
          bun install
          bun run build

      - name: Set up test fixtures
        run: cp -r fixtures/audio /tmp

      - name: Run tests with coverage
        run: bash scripts/tests-with-fifo.sh cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

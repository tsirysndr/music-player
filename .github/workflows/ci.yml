name: tests

on:
  push:
    branches: ["master"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["master"]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Dagger
        uses: ./.github/actions/setup-dagger
      - name: Run workspace tests with coverage
        run: dagger api call -m .dagger/ci rust-coverage --source . export --path artifacts/lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: artifacts/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

name: "Publish tags to FlakeHub"
on:
  push:
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to publish to FlakeHub"
        type: "string"
        required: true
jobs:
  flakehub-publish:
    runs-on: "ubuntu-latest"
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: "actions/checkout@v4"
        with:
          ref: "${{ (inputs.tag != null) && format('refs/tags/{0}', inputs.tag) || '' }}"
      - uses: fluentci-io/setup-fluentci@next
      - name: Install Determinate Nix
        shell: bash
        run: fluentci run setup-determinate-nix setup --sudo --trusted-users '["runner"]' --extra-conf '["experimental-features = nix-command flakes"]' | node .fluentci/github-env.mjs
      - name: Install FlakeHub publisher
        shell: bash
        run: fluentci run setup-flakehub-push setup | node .fluentci/github-env.mjs
      - name: Publish flake
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: fluentci run nix-publish flakehub --project . --run-dir "$RUNNER_TEMP/flakehub-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --name tsirysndr/music-player --version "$RELEASE_TAG" --visibility public

name: nix build

on:
  workflow_dispatch:

jobs:
  build:
    name: nix build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        if: runner.os == 'macOS'
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Build
        if: runner.os == 'macOS'
        run: nix build -L

      - name: Show binary info
        if: runner.os == 'macOS'
        run: |
          ls -la result/bin/
          file result/bin/music-player

      - name: Set up Dagger (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-dagger

      - name: Build with Nix in Dagger (Linux)
        if: runner.os == 'Linux'
        env:
          PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
        run: >-
          dagger --progress logs -v api call -m .dagger/ci nix-flake --source . --platform "$PLATFORM"

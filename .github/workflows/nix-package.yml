name: nix package

# Builds the nixpkgs-ready packages in nix/ (which fetch the released tag,
# unlike the flake) against nixos-unstable — nix/<pname>/package.nix copies
# verbatim to pkgs/by-name in a nixpkgs PR. Manual trigger only. After a
# version bump, set cargoHash to lib.fakeHash and dispatch once: the
# failing run prints the real hash on its "got:" line.

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.attr }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            attr: music-player
          - os: ubuntu-24.04-arm
            attr: music-player
          - os: macos-latest
            attr: music-player
          # The desktop client is Linux-only (meta.platforms).
          - os: ubuntu-latest
            attr: music-player-desktop
          - os: ubuntu-24.04-arm
            attr: music-player-desktop
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Set up Cachix
        uses: cachix/cachix-action@v16
        with:
          name: tsirysndr
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build
        if: runner.os == 'macOS'
        run: |
          nix-build nix -A ${{ matrix.attr }} \
            -I nixpkgs=channel:nixos-unstable

      - name: Show binary info
        if: runner.os == 'macOS'
        run: |
          ls -la result/bin/
          file result/bin/${{ matrix.attr }}

      - name: Set up Dagger (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-dagger

      - name: Build with Nix in Dagger (Linux)
        if: runner.os == 'Linux'
        env:
          PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
        run: >-
          dagger api call -m .dagger/ci nix-package --source . --platform "$PLATFORM" --attribute "${{ matrix.attr }}"
          export --path artifacts/nix

      # Import the Dagger-built closure so the existing Cachix post action can publish it.
      - name: Import Nix result for Cachix (Linux)
        if: runner.os == 'Linux'
        run: |
          nix copy --from "file://$PWD/artifacts/nix/store" "$(cat artifacts/nix/store-path)"
          ln -s "$(cat artifacts/nix/store-path)" result
          ls -la result/bin/
          file "result/bin/${{ matrix.attr }}"

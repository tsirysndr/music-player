name: release-desktop
# DISABLED: the Slint desktop client (release-slint-desktop.yml) now ships the
# macOS and Linux desktop assets. This workflow no longer runs on release; it
# is kept for manual dispatch only, in case a Tauri build is needed again.
# Note: it was the sole producer of the Windows MSI, so releases currently
# ship no Windows desktop asset until a Slint Windows leg exists.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing release tag to build and upload assets for (e.g. v0.2.0)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set release version
        shell: bash
        run: echo "RELEASE_VERSION=${TAG_INPUT:-${GITHUB_REF#refs/*/}}" >> $GITHUB_ENV
        env:
          TAG_INPUT: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust 1.98.0
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0

      - name: Install macOS targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.platform }}-desktop-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies (macos only)
        if: matrix.platform == 'macos-latest'
        run: brew install protobuf

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev protobuf-compiler
      - name: Install dependencies (windows only)
        if: matrix.platform == 'windows-latest'
        run: choco install protoc

      - name: Install node modules
        shell: bash
        run: |
          cd webui/musicplayer
          bun install

      # macos-latest runners are arm64, so both darwin architectures are
      # built with explicit targets rather than relying on the host.
      - name: Build app (macos x86_64)
        if: matrix.platform == 'macos-latest'
        run: |
          cd webui/musicplayer
          bun run tauri build --target x86_64-apple-darwin
      - name: Build app (macos aarch64)
        if: matrix.platform == 'macos-latest'
        run: |
          cd webui/musicplayer
          bun run tauri build --target aarch64-apple-darwin
      - name: Build app (ubuntu/windows)
        if: matrix.platform != 'macos-latest'
        shell: bash
        run: |
          cd webui/musicplayer
          bun run tauri build

      - name: Package + upload (macos)
        if: matrix.platform == 'macos-latest'
        run: |
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            arch=x64; [ "$target" = "aarch64-apple-darwin" ] && arch=aarch64
            cd target/$target/release/bundle
            tar -czvf music-player-desktop_${{ env.RELEASE_VERSION }}_$target.tar.gz "macos/Music Player.app"
            shasum -a 256 music-player-desktop_${{ env.RELEASE_VERSION }}_$target.tar.gz > music-player-desktop_${{ env.RELEASE_VERSION }}_$target.tar.gz.sha256
            mv dmg/Music\ Player*_$arch.dmg dmg/Music_Player_${{ env.RELEASE_VERSION }}_$arch.dmg
            shasum -a 256 dmg/Music_Player_${{ env.RELEASE_VERSION }}_$arch.dmg > dmg/Music_Player_${{ env.RELEASE_VERSION }}_$arch.dmg.sha256
            gh release upload ${{ env.RELEASE_VERSION }} \
              music-player-desktop_${{ env.RELEASE_VERSION }}_$target.tar.gz \
              music-player-desktop_${{ env.RELEASE_VERSION }}_$target.tar.gz.sha256 \
              dmg/Music_Player_${{ env.RELEASE_VERSION }}_$arch.dmg \
              dmg/Music_Player_${{ env.RELEASE_VERSION }}_$arch.dmg.sha256 \
              --clobber
            cd ../../../..
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package + upload (ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mv target/release/bundle/appimage/music-player*.AppImage target/release/bundle/appimage/music-player_${{ env.RELEASE_VERSION }}_amd64.AppImage
          mv target/release/bundle/deb/music-player*.deb target/release/bundle/deb/music-player_${{ env.RELEASE_VERSION }}_amd64.deb
          shasum -a 256 target/release/bundle/appimage/music-player_${{ env.RELEASE_VERSION }}_amd64.AppImage > target/release/bundle/appimage/music-player_${{ env.RELEASE_VERSION }}_amd64.AppImage.sha256
          shasum -a 256 target/release/bundle/deb/music-player_${{ env.RELEASE_VERSION }}_amd64.deb > target/release/bundle/deb/music-player_${{ env.RELEASE_VERSION }}_amd64.deb.sha256
          gh release upload ${{ env.RELEASE_VERSION }} \
            target/release/bundle/appimage/music-player_${{ env.RELEASE_VERSION }}_amd64.AppImage \
            target/release/bundle/appimage/music-player_${{ env.RELEASE_VERSION }}_amd64.AppImage.sha256 \
            target/release/bundle/deb/music-player_${{ env.RELEASE_VERSION }}_amd64.deb \
            target/release/bundle/deb/music-player_${{ env.RELEASE_VERSION }}_amd64.deb.sha256 \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package + upload (windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mv target/release/bundle/msi/Music*.msi target/release/bundle/msi/Music_Player_x64_en-US.msi
          sha256sum target/release/bundle/msi/Music_Player_x64_en-US.msi > target/release/bundle/msi/Music_Player_x64_en-US.msi.sha256
          gh release upload ${{ env.RELEASE_VERSION }} \
            target/release/bundle/msi/Music_Player_x64_en-US.msi \
            target/release/bundle/msi/Music_Player_x64_en-US.msi.sha256 \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

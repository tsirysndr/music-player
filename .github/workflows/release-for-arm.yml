name: release-for-arm
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing release tag to build and upload assets for (e.g. v0.2.0)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    name: release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      # Keep pipeline tooling at the workflow revision, even for an older release tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: release-source
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.github/actions/fluentci-toolchain
      - name: Set up Rust
        run: fluentci run setup-rust setup --toolchain 1.98.0 --targets "${{ matrix.target }}" | node .fluentci/github-env.mjs
      - run: fluentci run ci dependencies
      - name: Set release version
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: fluentci run ci release-version --tag "$TAG_INPUT"
      - name: Build and package binary
        run: fluentci run ci release --source ./release-source --target "${{ matrix.target }}" --version "$RELEASE_VERSION" --desktop=false
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: fluentci run ci github-assets --directory artifacts/release --tag "$RELEASE_VERSION"

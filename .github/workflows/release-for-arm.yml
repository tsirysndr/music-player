name: release-for-arm
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing release tag to build and upload assets for (e.g. v0.2.0)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    name: release ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            linker: aarch64-linux-gnu-gcc
            libdir: aarch64-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
            arch: armhf
            linker: arm-linux-gnueabihf-gcc
            libdir: arm-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set release version
        run: echo "RELEASE_VERSION=${TAG_INPUT:-${GITHUB_REF#refs/*/}}" >> $GITHUB_ENV
        env:
          TAG_INPUT: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-arm-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross toolchain + sysroot
        run: |
          sudo mkdir -p /build/sysroot
          echo "deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports/ jammy main universe" | sudo tee -a /etc/apt/sources.list
          sudo dpkg --add-architecture ${{ matrix.arch }}
          sudo apt-get update || true
          sudo apt-get install -y build-essential pkg-config protobuf-compiler gcc-aarch64-linux-gnu libc6-arm64-cross libc6-dev-arm64-cross gcc-arm-linux-gnueabihf libc6-armhf-cross libc6-dev-armhf-cross
          cd /tmp
          apt-get download libasound2:${{ matrix.arch }} libasound2-dev:${{ matrix.arch }}
          for deb in libasound2*.deb; do sudo dpkg -x "$deb" /build/sysroot/; done
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "C_INCLUDE_PATH=/build/sysroot/usr/include" >> $GITHUB_ENV
          echo "RUSTFLAGS=-C linker=${{ matrix.linker }} -L/usr/${{ matrix.libdir }}/lib -L/build/sysroot/usr/lib/${{ matrix.libdir }} -L/build/sysroot/lib/${{ matrix.libdir }}" >> $GITHUB_ENV

      - name: Build webui
        run: |
          cd webui/musicplayer
          bun install
          bun run build

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          ASSET=music-player_${{ env.RELEASE_VERSION }}_${{ matrix.target }}
          tar czvf $ASSET.tar.gz -C target/${{ matrix.target }}/release music-player
          sha256sum $ASSET.tar.gz > $ASSET.tar.gz.sha256

      - name: Upload release assets
        run: |
          gh release upload ${{ env.RELEASE_VERSION }} \
            music-player_${{ env.RELEASE_VERSION }}_${{ matrix.target }}.tar.gz \
            music-player_${{ env.RELEASE_VERSION }}_${{ matrix.target }}.tar.gz.sha256 \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

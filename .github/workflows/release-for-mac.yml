name: release-for-mac
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing release tag to build and upload assets for (e.g. v0.2.0)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    name: release ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin

    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: release-source
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.github/actions/fluentci-toolchain
      - name: Set up Rust
        run: fluentci run setup-rust setup --toolchain 1.98.0 --targets "${{ matrix.target }}" | node .fluentci/github-env.mjs
      - run: fluentci run ci dependencies
      - name: Set release version
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: fluentci run ci release-version --tag "$TAG_INPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/fluentci/rust/1.98.0/cargo/registry
            ~/.local/share/fluentci/rust/1.98.0/cargo/git
            target/
            release-source/target/
          key: ${{ runner.os }}-${{ matrix.target }}-cli-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build and package release
        run: fluentci run ci release --source ./release-source --target "${{ matrix.target }}" --version "$RELEASE_VERSION" --desktop=false
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: fluentci run ci github-assets --directory artifacts/release --tag "$RELEASE_VERSION"

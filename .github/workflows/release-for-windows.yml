on:
  pull_request:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing release tag to build and upload assets for (e.g. v0.2.0)"
        type: string
        required: false
      publish:
        description: Upload missing assets to the existing release
        type: boolean
        default: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
  PUBLISH_RELEASE: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

jobs:
  compile:
    name: Compile
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test publication gates
        run: python scripts/test-release-assets.py
      - name: Validate release metadata
        run: python scripts/release-assets.py prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: |
          choco install protoc -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Chocolatey may report success after a feed error without installing.
          $protoc = (Get-Command protoc -CommandType Application -ErrorAction Stop).Source
          & $protoc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          rustup toolchain install 1.98.0-x86_64-pc-windows-gnu --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.98.0-x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gcc -dumpmachine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Windows uses the upstream shared DuckDB C API library.
      # Setting these in the environment overrides the
      # static defaults in .cargo/config.toml, which exist for the platforms
      # that do have one.
      - name: Vendor DuckDB (shared)
        shell: pwsh
        run: |
          $version = "1.5.5"
          $dir = "$env:GITHUB_WORKSPACE\vendor\duckdb\lib"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://github.com/duckdb/duckdb/releases/download/v$version/libduckdb-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\libduckdb.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\libduckdb.zip" -DestinationPath $dir -Force
          # The .dll has to sit beside the executable at run time as well.
          echo "DUCKDB_LIB_DIR=$dir" >> $env:GITHUB_ENV
          echo "DUCKDB_STATIC=0" >> $env:GITHUB_ENV
          echo "$dir" >> $env:GITHUB_PATH

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build Web UI
        working-directory: webui/musicplayer
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run build

      - name: Test ReplayGain ABI conversion
        run: cargo test --locked -p rockbox-playback --lib replaygain_c_long_preserves_values_and_saturates

      - name: Build CLI
        run: cargo build --locked --release -p music-player --target x86_64-pc-windows-gnu

      - name: Package and verify CLI
        run: |
          $binaryDir = 'target/x86_64-pc-windows-gnu/release'
          Copy-Item vendor/duckdb/lib/duckdb.dll $binaryDir
          $gccDir = Split-Path (Get-Command gcc).Source
          foreach ($dll in @('libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'libwinpthread-1.dll')) {
            $runtime = Join-Path $gccDir $dll
            if (Test-Path $runtime) { Copy-Item $runtime $binaryDir }
          }
          & "$binaryDir/music-player.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $asset = "music-player_$env:RELEASE_VERSION`_x86_64-pc-windows-gnu.tar.gz"
          $payload = @('music-player.exe') + @(Get-ChildItem $binaryDir -Filter *.dll | ForEach-Object { $_.Name })
          tar -czf $asset -C $binaryDir @payload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smokeDir = Join-Path $env:RUNNER_TEMP 'music-player-archive-smoke'
          New-Item -ItemType Directory -Force $smokeDir | Out-Null
          tar -xzf $asset -C $smokeDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $buildPath = $env:PATH
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          Push-Location $smokeDir
          try {
            & ./music-player.exe --help
            if ($LASTEXITCODE -ne 0) { throw 'Extracted CLI failed to start' }
          } finally {
            Pop-Location
            $env:PATH = $buildPath
          }
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ascii "$asset.sha256"

      - name: Save validation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-cli-x86_64
          path: '*.tar.gz*'
          if-no-files-found: error

      - name: Upload missing release assets
        if: env.PUBLISH_RELEASE == 'true'
        run: python scripts/release-assets.py publish '*.tar.gz*'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: release-slint-desktop
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing release tag to build and upload assets for (e.g. v0.2.0)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    name: release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            mac_arch: aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            mac_arch: x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.github/actions/fluentci-toolchain
      - name: Set up Rust
        run: fluentci run setup-rust setup --toolchain 1.98.0 --targets "${{ matrix.target }}" | node .fluentci/github-env.mjs
      - run: fluentci run ci dependencies
      - name: Set release version
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: fluentci run ci release-version --tag "$TAG_INPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/fluentci/rust/1.98.0/cargo/registry
            ~/.local/share/fluentci/rust/1.98.0/cargo/git
            target/
            release-source/target/
          key: ${{ runner.os }}-${{ matrix.target }}-desktop-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build and package release
        run: fluentci run ci release --source . --target "${{ matrix.target }}" --version "$RELEASE_VERSION" --desktop=true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: fluentci run ci github-assets --directory artifacts/release --tag "$RELEASE_VERSION"

      - name: Set up Gemfury transport
        if: runner.os == 'Linux'
        run: fluentci run setup-gemfury setup --sudo | node .fluentci/github-env.mjs
      - name: Push Debian and RPM packages to Gemfury
        if: runner.os == 'Linux'
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
        run: fluentci run ci gemfury-directory --directory artifacts/release/dist

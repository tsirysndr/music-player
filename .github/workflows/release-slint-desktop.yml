name: release-slint-desktop
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing release tag to build and upload assets for (e.g. v0.2.0)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    name: release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      # Always build the ref the workflow runs on (the selected branch for a
      # manual dispatch, the tag for a release event). Checking out the INPUT
      # tag would rebuild that tag's tree — which may predate the desktop
      # crate entirely; the tag input only selects which release to upload to.
      - uses: actions/checkout@v4

      - name: Set release version
        run: echo "RELEASE_VERSION=${TAG_INPUT:-${GITHUB_REF#refs/*/}}" >> $GITHUB_ENV
        env:
          TAG_INPUT: ${{ inputs.tag }}

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-slint-desktop-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config protobuf-compiler \
            libasound2-dev libdbus-1-dev libfontconfig1-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      # music-player-webui embeds webui/musicplayer/build at compile time.
      - name: Build webui
        run: |
          cd webui/musicplayer
          bun install
          bun run build

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p music-player -p music-player-desktop

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y dpkg-dev rpm

      - name: Build Debian and RPM packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) package_arch=x86_64 ;;
            aarch64-unknown-linux-gnu) package_arch=aarch64 ;;
            *) echo "Unsupported Linux target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          ./dist/package-linux.sh all \
            "${{ env.RELEASE_VERSION }}" \
            "$package_arch" \
            "target/${{ matrix.target }}/release"

      - name: Package binary
        run: |
          ASSET=music-player-desktop_${{ env.RELEASE_VERSION }}_${{ matrix.target }}
          tar czvf $ASSET.tar.gz -C target/${{ matrix.target }}/release music-player-desktop
          if command -v sha256sum >/dev/null; then
            sha256sum $ASSET.tar.gz > $ASSET.tar.gz.sha256
          else
            shasum -a 256 $ASSET.tar.gz > $ASSET.tar.gz.sha256
          fi

      - name: Upload release assets
        run: |
          gh release upload ${{ env.RELEASE_VERSION }} \
            music-player-desktop_${{ env.RELEASE_VERSION }}_${{ matrix.target }}.tar.gz \
            music-player-desktop_${{ env.RELEASE_VERSION }}_${{ matrix.target }}.tar.gz.sha256 \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux packages to GitHub release
        if: runner.os == 'Linux'
        shell: bash
        run: gh release upload "${{ env.RELEASE_VERSION }}" dist/*.deb dist/*.deb.sha256 dist/*.rpm dist/*.rpm.sha256 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Gemfury secrets
        if: runner.os == 'Linux'
        id: gemfury
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
        run: |
          if [ -n "$FURY_TOKEN" ] && [ -n "$FURY_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Gemfury secrets not set; skipping package upload"
          fi

      - name: Push Debian and RPM packages to Gemfury
        if: runner.os == 'Linux' && steps.gemfury.outputs.available == 'true'
        shell: bash
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
        run: |
          for package in dist/*.deb dist/*.rpm; do
            curl -fsS -F package=@"$package" \
              "https://${FURY_TOKEN}@push.fury.io/${FURY_ACCOUNT}/"
            echo
          done

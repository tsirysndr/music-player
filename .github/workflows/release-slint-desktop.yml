name: release-slint-desktop
on:
  pull_request:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing release tag to build and upload assets for (e.g. v0.2.0)"
        type: string
        required: false
      publish:
        description: Upload missing assets to the existing release
        type: boolean
        default: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
  PUBLISH_RELEASE: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

jobs:
  release:
    name: release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            mac_arch: aarch64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            mac_arch: x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      # Always build the ref the workflow runs on (the selected branch for a
      # manual dispatch, the tag for a release event). Checking out the INPUT
      # tag would rebuild that tag's tree — which may predate the desktop
      # crate entirely; the tag input only selects which release to upload to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release metadata
        run: python3 scripts/release-assets.py prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Vendor DuckDB
        # `libduckdb-sys` resolves `-l static=duckdb_static` when its own crate
        # compiles, and Cargo gives no way to order another crate's build script
        # ahead of that — so the libraries must be on disk before cargo runs at
        # all. See scripts/fetch-duckdb.sh.
        run: ./scripts/fetch-duckdb.sh
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add ${{ matrix.target }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-slint-desktop-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config protobuf-compiler \
            libasound2-dev libdbus-1-dev libfontconfig1-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      # music-player-webui embeds webui/musicplayer/build at compile time.
      - name: Build webui
        run: |
          cd webui/musicplayer
          bun install --frozen-lockfile
          bun run build

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} -p music-player -p music-player-desktop

      - name: Verify CLI startup
        run: target/${{ matrix.target }}/release/music-player --help

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y dpkg-dev rpm

      - name: Build Debian and RPM packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) package_arch=x86_64 ;;
            aarch64-unknown-linux-gnu) package_arch=aarch64 ;;
            *) echo "Unsupported Linux target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          ./dist/package-linux.sh all \
            "${{ env.RELEASE_VERSION }}" \
            "$package_arch" \
            "target/${{ matrix.target }}/release"

      - name: Package binary (Linux)
        if: runner.os == 'Linux'
        run: |
          ASSET=music-player-desktop_${{ env.RELEASE_VERSION }}_${{ matrix.target }}
          tar czvf $ASSET.tar.gz -C target/${{ matrix.target }}/release music-player-desktop
          sha256sum $ASSET.tar.gz > $ASSET.tar.gz.sha256

      # COPYFILE_DISABLE excludes AppleDouble files from the signed bundle.
      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        run: |
          ./dist/package-macos.sh all "${{ env.RELEASE_VERSION }}" \
            "target/${{ matrix.target }}/release"

          ASSET=music-player-desktop_${{ env.RELEASE_VERSION }}_${{ matrix.target }}
          COPYFILE_DISABLE=1 tar czvf $ASSET.tar.gz -C dist/build "macos/Music Player.app"
          shasum -a 256 $ASSET.tar.gz > $ASSET.tar.gz.sha256

          DMG=Music_Player_${{ env.RELEASE_VERSION }}_${{ matrix.mac_arch }}.dmg
          mv "dist/build/Music Player.dmg" "$DMG"
          shasum -a 256 $DMG > $DMG.sha256

      - name: Save validation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            *.tar.gz*
            *.dmg*
            dist/*.deb*
            dist/*.rpm*
          if-no-files-found: error

      - name: Upload release assets
        if: env.PUBLISH_RELEASE == 'true'
        run: python3 scripts/release-assets.py publish '*.tar.gz*'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS disk image
        if: env.PUBLISH_RELEASE == 'true' && runner.os == 'macOS'
        run: python3 scripts/release-assets.py publish '*.dmg*'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux packages to GitHub release
        if: env.PUBLISH_RELEASE == 'true' && runner.os == 'Linux'
        shell: bash
        run: python3 scripts/release-assets.py publish 'dist/*.deb*' 'dist/*.rpm*'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Gemfury secrets
        if: github.event_name == 'release' && runner.os == 'Linux'
        id: gemfury
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
        run: |
          if [ -n "$FURY_TOKEN" ] && [ -n "$FURY_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Gemfury secrets not set; skipping package upload"
          fi

      - name: Push Debian and RPM packages to Gemfury
        if: runner.os == 'Linux' && steps.gemfury.outputs.available == 'true'
        shell: bash
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
        run: |
          for package in dist/*.deb dist/*.rpm; do
            curl -fsS -F package=@"$package" \
              "https://${FURY_TOKEN}@push.fury.io/${FURY_ACCOUNT}/"
            echo
          done

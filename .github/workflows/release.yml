name: release
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing release tag to build and upload assets for (e.g. v0.2.0)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
    steps:
      # Keep pipeline tooling at the workflow revision, even for an older release tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: release-source
      - name: Set up Dagger
        uses: ./.github/actions/setup-dagger
      - name: Set release version
        run: echo "RELEASE_VERSION=${TAG_INPUT:-${GITHUB_REF#refs/*/}}" >> "$GITHUB_ENV"
        env:
          TAG_INPUT: ${{ inputs.tag }}

      - name: Build and package Linux binary
        run: >-
          dagger --progress logs -v api call -m .dagger/ci linux-release
          --source ./release-source
          --target "${{ matrix.target }}"
          --version "$RELEASE_VERSION"
          export --path artifacts/release

      - name: Upload release assets with Dagger
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          args=()
          for file in artifacts/release/**/*; do
            [[ -f "$file" ]] || continue
            args+=(--files "${file#artifacts/release/}")
          done
          ((${#args[@]} > 0)) || { echo "No release assets found" >&2; exit 1; }
          dagger --progress logs -v api call -m .dagger/modules/github-assets upload \
            --assets artifacts/release "${args[@]}" --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_VERSION" --token env:GH_TOKEN --clobber \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-$TARGET"

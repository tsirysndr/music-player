name: Linux CLI distribution
on:
  pull_request:
    paths-ignore: ['**/*.md']
  push:
    branches: [master, 'feat/headless-release', 'feat/slim-runtime']
    paths-ignore: ['**/*.md']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional existing tag; required for publishing'
        type: string
      publish:
        description: 'Upload to an existing release and publish the versioned GHCR image'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-cli-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Manual recovery builds the selected ref; tag supplies release identity.
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - name: Resolve source and release identity
        id: meta
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          PUBLISH: ${{ github.event_name == 'release' || inputs.publish == true }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-metadata.py
      - name: Test service installer account and policy handling
        run: python3 scripts/test-service-install.py
      - name: Recheck Action releases and documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-action-versions.py .github/workflows/release.yml

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      SOURCE_REVISION: ${{ needs.prepare.outputs.sha }}
      IMAGE_SOURCE: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Install build and package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev pkg-config protobuf-compiler dpkg-dev rpm cpio unzip
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add --toolchain 1.98.0 "$TARGET"
      - name: Build embedded Web UI and canonical CLI
        run: |
          bash scripts/fetch-duckdb.sh
          (cd webui/musicplayer && bun install --frozen-lockfile && bun run build)
          cargo +1.98.0 build --locked --release --target "$TARGET" -p music-player --bin music-player
          strip --strip-debug "target/$TARGET/release/music-player"
      - name: Package and verify binary identity
        run: bash scripts/package-headless.sh
      - name: Test DEB systemd lifecycle on the native runner
        run: sudo --preserve-env=ARCH python3 scripts/test-systemd.py
      - name: Assemble and test native runtime image and packages
        run: |
          bash scripts/test-container.sh
          bash scripts/test-rpm.sh
          mkdir -p dist/build/image-export
          docker save "music-player-ci:$ARCH" | gzip -1 > "dist/build/image-export/image-$ARCH.tar.gz"
      - name: Upload packages and validation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-cli-${{ matrix.arch }}
          path: dist/build/release/*
          compression-level: 0
          if-no-files-found: error
      - name: Upload tested runtime image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-image-${{ matrix.arch }}
          path: dist/build/image-export/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-diagnostics-${{ matrix.arch }}
          path: dist/build/evidence/
          if-no-files-found: warn

  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      IMAGE: ${{ needs.prepare.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-cli-*
          path: dist/build/release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-image-*
          path: dist/build/image-export
          merge-multiple: true
      - name: Publish tested artifacts
        run: python3 scripts/publish-headless.py

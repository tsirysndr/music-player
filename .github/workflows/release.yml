name: release
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing release tag to build and upload assets for (e.g. v0.2.0)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
    steps:
      # Keep pipeline tooling at the workflow revision, even for an older release tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: release-source
      - name: Set up Dagger
        uses: ./.github/actions/setup-dagger
      - name: Set release version
        run: echo "RELEASE_VERSION=${TAG_INPUT:-${GITHUB_REF#refs/*/}}" >> "$GITHUB_ENV"
        env:
          TAG_INPUT: ${{ inputs.tag }}

      - name: Build and package Linux binary
        run: >-
          dagger api call -m .dagger/ci linux-release
          --source ./release-source
          --target "${{ matrix.target }}"
          --version "$RELEASE_VERSION"
          export --path artifacts/release

      - name: Upload release assets
        run: |
          gh release upload "$RELEASE_VERSION" \
            artifacts/release/music-player_"${RELEASE_VERSION}"_"${{ matrix.target }}".tar.gz \
            artifacts/release/music-player_"${RELEASE_VERSION}"_"${{ matrix.target }}".tar.gz.sha256 \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

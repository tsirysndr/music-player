name: rust-clippy analyze

on:
  push:
    branches: ["master"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["master"]
  schedule:
    - cron: "16 10 * * 5"

jobs:
  rust-clippy-analyze:
    name: Run rust-clippy analyzing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.github/actions/fluentci-toolchain
      - name: Set up Rust
        run: fluentci run setup-rust setup --toolchain 1.98.0 --components llvm-tools-preview,clippy | node .fluentci/github-env.mjs
      - run: fluentci run ci dependencies
      - name: Analyze with Clippy
        run: fluentci run ci clippy
        continue-on-error: true
      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: artifacts/rust-clippy-results.sarif
          wait-for-processing: true

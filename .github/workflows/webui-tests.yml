name: webui tests

# Only when the web client changes: the suite is entirely front-end, so a
# Rust-only commit has nothing here to break. The workflow file itself is in
# the filter so a change to this file is checked by the run it describes.
on:
  push:
    branches: ["master"]
    paths:
      - "webui/musicplayer/**"
      - ".github/workflows/webui-tests.yml"
      - ".github/actions/setup-dagger/**"
      - ".dagger/**"
      - "mise.toml"
      - "dagger.toml"
      - "dagger.lock"
  pull_request:
    branches: ["master"]
    paths:
      - "webui/musicplayer/**"
      - ".github/workflows/webui-tests.yml"
      - ".github/actions/setup-dagger/**"
      - ".dagger/**"
      - "mise.toml"
      - "dagger.toml"
      - "dagger.lock"
  workflow_dispatch:

# A new push supersedes whatever was running for the same ref.
concurrency:
  group: webui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Dagger
        uses: ./.github/actions/setup-dagger
      - name: Typecheck, test, build web UI and Storybook
        run: dagger --progress logs -v api call -m .dagger/ci web-check --source . export --path artifacts/webui

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: artifacts/webui/coverage/lcov.info
          flags: webui
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

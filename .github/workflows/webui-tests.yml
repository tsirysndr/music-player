name: webui tests

# Only when the web client changes: the suite is entirely front-end, so a
# Rust-only commit has nothing here to break. The workflow file itself is in
# the filter so a change to this file is checked by the run it describes.
on:
  push:
    branches: ["master"]
    paths:
      - "webui/musicplayer/**"
      - ".github/workflows/webui-tests.yml"
      - ".github/actions/fluentci-toolchain/**"
      - ".fluentci/**"
      - "fluentci.toml"
  pull_request:
    branches: ["master"]
    paths:
      - "webui/musicplayer/**"
      - ".github/workflows/webui-tests.yml"
      - ".github/actions/fluentci-toolchain/**"
      - ".fluentci/**"
      - "fluentci.toml"
  workflow_dispatch:

# A new push supersedes whatever was running for the same ref.
concurrency:
  group: webui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.github/actions/fluentci-toolchain
      - name: Typecheck, test, build web UI and Storybook
        run: fluentci run ci web-check
      - name: Set up Codecov
        run: fluentci run setup-codecov setup | node .fluentci/github-env.mjs
      - name: Upload coverage to Codecov
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          COVERAGE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: fluentci run ci codecov --report artifacts/webui/coverage/lcov.info --commit "$COVERAGE_COMMIT" --flag webui

[package]
name = "music-player-analysis"
version = "0.2.1"
edition = "2021"
repository = "https://github.com/tsirysndr/music-player"
license = "MIT"
authors = ["Tsiry Sandratraina <tsiry.sndr@rocksky.app>"]
description = "Tempo, mood, loudness and waveform analysis for music-player"

[dependencies]
anyhow = "1.0.67"
ebur128 = "0.1"
oximedia-mir = { version = "0.2", default-features = false, features = ["tempo", "mood"] }
serde = { version = "1.0.144", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3", "pcm", "aac", "alac", "isomp4", "vorbis", "ogg", "wav", "adpcm"] }
tracing = "0.1.37"

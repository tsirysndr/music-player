<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- music-player app icon. Palette is the Synthwave skin (desktop/skins/synthwave.toml):
       violet-black chassis (window_bg/panel_bg/panel_raised), hot magenta accent,
       cyan phosphor. Flat white Apple-Music-style quaver with a chromatic
       accent/display split, over a receding neon floor. -->
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>

    <!-- panel_raised in the middle falling off to window_bg at the edges -->
    <radialGradient id="bg" cx="50%" cy="36%" r="82%">
      <stop offset="0%"   stop-color="#1e182f"/>
      <stop offset="48%"  stop-color="#151122"/>
      <stop offset="100%" stop-color="#0d0b14"/>
    </radialGradient>

    <linearGradient id="horizon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1024" y2="0">
      <stop offset="0%"   stop-color="#ff2d95" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ff2d95"/>
      <stop offset="100%" stop-color="#ff2d95" stop-opacity="0"/>
    </linearGradient>

    <!-- grid fades out towards the vanishing point so the near rows read strongest -->
    <linearGradient id="gridFade" gradientUnits="userSpaceOnUse" x1="0" y1="622" x2="0" y2="1024">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="35%"  stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>
    <mask id="gridMask">
      <rect x="0" y="600" width="1024" height="424" fill="url(#gridFade)"/>
    </mask>

    <filter id="blurXL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="blurM" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blurS" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- Apple-Music-style beamed double quaver: stems flush with the beam ends
         so the left and right profiles are unbroken verticals, up-slanted beam
         at twice the stem width, tilted noteheads that swallow the stem ends. -->
    <g id="noteShape">
      <path d="M422 322 L722 278 L722 350 L422 394 Z"/>
      <rect x="422" y="322" width="36" height="332"/>
      <rect x="686" y="278" width="36" height="344"/>
      <ellipse cx="380" cy="667" rx="94" ry="64" transform="rotate(-20 380 667)"/>
      <ellipse cx="644" cy="635" rx="94" ry="64" transform="rotate(-20 644 635)"/>
    </g>

    <!-- perspective floor: verticals converge on (512, 622) -->
    <g id="gridLines" fill="none" stroke-linecap="round">
      <g stroke-width="2.8">
        <line x1="512" y1="622" x2="-1180" y2="1120"/>
        <line x1="512" y1="622" x2="-720"  y2="1120"/>
        <line x1="512" y1="622" x2="-340"  y2="1120"/>
        <line x1="512" y1="622" x2="-60"   y2="1120"/>
        <line x1="512" y1="622" x2="160"   y2="1120"/>
        <line x1="512" y1="622" x2="330"   y2="1120"/>
        <line x1="512" y1="622" x2="440"   y2="1120"/>
        <line x1="512" y1="622" x2="512"   y2="1120"/>
        <line x1="512" y1="622" x2="584"   y2="1120"/>
        <line x1="512" y1="622" x2="694"   y2="1120"/>
        <line x1="512" y1="622" x2="864"   y2="1120"/>
        <line x1="512" y1="622" x2="1084"  y2="1120"/>
        <line x1="512" y1="622" x2="1364"  y2="1120"/>
        <line x1="512" y1="622" x2="1744"  y2="1120"/>
        <line x1="512" y1="622" x2="2204"  y2="1120"/>
      </g>
      <line x1="0" y1="631"  x2="1024" y2="631"  stroke-width="1.3"/>
      <line x1="0" y1="641"  x2="1024" y2="641"  stroke-width="1.5"/>
      <line x1="0" y1="654"  x2="1024" y2="654"  stroke-width="1.8"/>
      <line x1="0" y1="672"  x2="1024" y2="672"  stroke-width="2.1"/>
      <line x1="0" y1="696"  x2="1024" y2="696"  stroke-width="2.5"/>
      <line x1="0" y1="728"  x2="1024" y2="728"  stroke-width="3.0"/>
      <line x1="0" y1="771"  x2="1024" y2="771"  stroke-width="3.5"/>
      <line x1="0" y1="828"  x2="1024" y2="828"  stroke-width="4.2"/>
      <line x1="0" y1="905"  x2="1024" y2="905"  stroke-width="5.0"/>
      <line x1="0" y1="1008" x2="1024" y2="1008" stroke-width="6.0"/>
    </g>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- chassis -->
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- faint stars, skin `text` -->
    <g fill="#ece7f5">
      <circle cx="150" cy="150" r="3.2" opacity="0.26"/>
      <circle cx="864" cy="122" r="2.4" opacity="0.22"/>
      <circle cx="920" cy="330" r="3.0" opacity="0.20"/>
      <circle cx="96"  cy="420" r="2.2" opacity="0.18"/>
      <circle cx="250" cy="256" r="1.8" opacity="0.20"/>
      <circle cx="790" cy="212" r="1.8" opacity="0.18"/>
      <circle cx="530" cy="120" r="2.0" opacity="0.14"/>
      <circle cx="170" cy="620" r="1.6" opacity="0.12"/>
      <circle cx="880" cy="560" r="1.8" opacity="0.12"/>
    </g>

    <!-- ── the grid ─────────────────────────────────────────────────── -->
    <g mask="url(#gridMask)">
      <!-- soft accent light bath under the floor -->
      <g stroke="#ff2d95" opacity="0.3" filter="url(#blurXL)">
        <use href="#gridLines" xlink:href="#gridLines"/>
      </g>
      <!-- display cyan one way, accent the other: same chromatic split as the note -->
      <g transform="translate(-6 0)" stroke="#00e5ff" opacity="0.3" filter="url(#blurM)">
        <use href="#gridLines" xlink:href="#gridLines"/>
      </g>
      <g transform="translate(6 0)" stroke="#ff2d95" opacity="0.34" filter="url(#blurM)">
        <use href="#gridLines" xlink:href="#gridLines"/>
      </g>
      <!-- crisp strokes: accent, then accent_hover -->
      <g stroke="#ff2d95" opacity="0.5" filter="url(#blurS)">
        <use href="#gridLines" xlink:href="#gridLines"/>
      </g>
      <g stroke="#ff5cab" opacity="0.55">
        <use href="#gridLines" xlink:href="#gridLines"/>
      </g>
      <!-- faint tube core so the lines stay crisp at small sizes -->
      <g stroke="#ece7f5" opacity="0.16">
        <use href="#gridLines" xlink:href="#gridLines"/>
      </g>
    </g>

    <!-- horizon glow -->
    <ellipse cx="512" cy="618" rx="560" ry="60" fill="#ff2d95" opacity="0.18" filter="url(#blurXL)"/>
    <rect x="0" y="613" width="1024" height="6" fill="url(#horizon)" opacity="0.5" filter="url(#blurS)"/>

    <!-- ── the note ─────────────────────────────────────────────────── -->
    <!-- ambient bloom, split display-cyan / accent like a mis-registered print -->
    <g transform="translate(-14 -9)" fill="#00e5ff" opacity="0.55" filter="url(#blurXL)">
      <use href="#noteShape" xlink:href="#noteShape"/>
    </g>
    <g transform="translate(14 9)" fill="#ff2d95" opacity="0.55" filter="url(#blurXL)">
      <use href="#noteShape" xlink:href="#noteShape"/>
    </g>
    <!-- tight chromatic offsets -->
    <g transform="translate(-11 -7)" fill="#00e5ff" opacity="0.95" filter="url(#blurS)">
      <use href="#noteShape" xlink:href="#noteShape"/>
    </g>
    <g transform="translate(11 7)" fill="#ff2d95" opacity="0.95" filter="url(#blurS)">
      <use href="#noteShape" xlink:href="#noteShape"/>
    </g>
    <g transform="translate(-7 -4)" fill="#00e5ff">
      <use href="#noteShape" xlink:href="#noteShape"/>
    </g>
    <g transform="translate(7 4)" fill="#ff2d95">
      <use href="#noteShape" xlink:href="#noteShape"/>
    </g>
    <!-- flat white note on top -->
    <g fill="#ffffff">
      <use href="#noteShape" xlink:href="#noteShape"/>
    </g>

    <!-- subtle top sheen on the chassis -->
    <ellipse cx="512" cy="-120" rx="820" ry="300" fill="#ffffff" opacity="0.04" filter="url(#blurXL)"/>
  </g>
</svg>

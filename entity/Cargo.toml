[package]
authors = ["Tsiry Sandratraina <tsiry.sndr@aol.com>"]
description = "Entities for the music player"
edition = "2021"
license = "MIT"
name = "music-player-entity"
repository = "https://github.com/tsirysndr/music-player"
version = "0.1.7"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.music-player-types]
path = "../types"
version = "0.1.3"

[dependencies.music-player-pdk]
path = "../pdk"
version = "0.1.0"

[dependencies]
chrono = "0.4.23"
md5 = "0.7.0"
sea-orm = {version = "0.9.2", features = ["runtime-tokio-rustls", "sqlx-sqlite"]}
serde = "1.0.145"
upnp-client = "0.1.9"

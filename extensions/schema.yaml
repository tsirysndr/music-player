version: v1-draft
exports:
  on_track_played:
    description: |
      Called when a play crosses the scrobble threshold — half the track or
      four minutes, whichever comes first. Requires the `events` capability.
    input:
      $ref: "#/components/schemas/PlayEvent"
      contentType: application/json
  on_track_skipped:
    description: |
      Called when a track is passed over before the play threshold.
      Requires the `events` capability.
    input:
      $ref: "#/components/schemas/SkipEvent"
      contentType: application/json
  on_track_liked:
    description: |
      Called when a track is liked or unliked. Requires the `events` capability.
    input:
      $ref: "#/components/schemas/LikeEvent"
      contentType: application/json
  on_playlist_created:
    description: |
      Called when a playlist is created, smart or hand-picked.
      Requires the `events` capability.
    input:
      $ref: "#/components/schemas/PlaylistEvent"
      contentType: application/json
  on_scan_completed:
    description: |
      Called when a library scan finishes. Requires the `events` capability.
    input:
      $ref: "#/components/schemas/ScanEvent"
      contentType: application/json

  get_metadata:
    description: |
      Supply metadata the player does not have for a track: lyrics, artwork,
      a biography, genre tags. Return the fields you know and leave the rest
      unset — the host takes the first non-empty answer across the enabled
      providers. Requires the `metadata` capability.
    input:
      $ref: "#/components/schemas/MetadataRequest"
      contentType: application/json
    output:
      $ref: "#/components/schemas/MetadataResponse"
      contentType: application/json

  commands:
    description: |
      List the actions this extension offers. Called once when the extension
      loads. Requires the `commands` capability.
    output:
      type: array
      items:
        $ref: "#/components/schemas/CommandSpec"
      contentType: application/json
  run_command:
    description: |
      Run one of the actions returned by `commands`.
      Requires the `commands` capability.
    input:
      $ref: "#/components/schemas/CommandRequest"
      contentType: application/json
    output:
      $ref: "#/components/schemas/CommandResponse"
      contentType: application/json

  predicates:
    description: |
      List the smart-playlist predicates this extension adds. They become
      usable in filters as `ext:<name>`, e.g. `ext:mood==chill`.
      Requires the `predicates` capability.
    output:
      type: array
      items:
        $ref: "#/components/schemas/PredicateSpec"
      contentType: application/json
  evaluate:
    description: |
      Decide whether one track satisfies one predicate. Called per candidate
      track while a smart playlist is generated, so keep it cheap.
      Requires the `predicates` capability.
    input:
      $ref: "#/components/schemas/PredicateRequest"
      contentType: application/json
    output:
      $ref: "#/components/schemas/PredicateResponse"
      contentType: application/json

  source_info:
    description: |
      Describe the media source this extension provides. Called once when the
      extension loads. Requires the `source` capability.
    output:
      $ref: "#/components/schemas/SourceInfo"
      contentType: application/json
  list_albums:
    description: |
      Page through the source's albums. Requires the `source` capability.
    input:
      $ref: "#/components/schemas/BrowseRequest"
      contentType: application/json
    output:
      type: array
      items:
        $ref: "#/components/schemas/SourceAlbum"
      contentType: application/json
  list_artists:
    description: |
      Page through the source's artists. Requires the `source` capability.
    input:
      $ref: "#/components/schemas/BrowseRequest"
      contentType: application/json
    output:
      type: array
      items:
        $ref: "#/components/schemas/SourceArtist"
      contentType: application/json
  list_tracks:
    description: |
      Page through the source's tracks. Set `parentId` to list the tracks of
      one album or playlist. Requires the `source` capability.
    input:
      $ref: "#/components/schemas/BrowseRequest"
      contentType: application/json
    output:
      type: array
      items:
        $ref: "#/components/schemas/Track"
      contentType: application/json
  list_playlists:
    description: |
      Page through the source's playlists. Requires the `source` capability.
    input:
      $ref: "#/components/schemas/BrowseRequest"
      contentType: application/json
    output:
      type: array
      items:
        $ref: "#/components/schemas/SourcePlaylist"
      contentType: application/json
  get_stream_url:
    description: |
      Resolve one of the source's track ids to something the player can
      actually decode — a direct http(s) url. Called at play time rather than
      while browsing, so a signed or expiring url stays fresh.
      Requires the `source` capability.
    input:
      $ref: "#/components/schemas/StreamRequest"
      contentType: application/json
    output:
      $ref: "#/components/schemas/StreamResponse"
      contentType: application/json

  source_identity_v2:
    description: "Return authenticated remote server/user identity. Requires sourceApiVersion=2 and all six v2 exports. Failure must not fall back to legacy source calls."
    input:
      $ref: "#/components/schemas/SourceV2IdentityRequest"
      contentType: application/json
    output:
      $ref: "#/components/schemas/SourceV2SourceIdentity"
      contentType: application/json

  browse_media_v2:
    description: "Browse or search one explicit page of containers and leaves. Requires sourceApiVersion=2 and all six v2 exports. Failure must not fall back to legacy source calls."
    input:
      $ref: "#/components/schemas/SourceV2BrowseRequest"
      contentType: application/json
    output:
      $ref: "#/components/schemas/SourceV2BrowseResponse"
      contentType: application/json

  get_media_item_v2:
    description: "Read persistent metadata for one remote item. Requires sourceApiVersion=2 and all six v2 exports. Failure must not fall back to legacy source calls."
    input:
      $ref: "#/components/schemas/SourceV2ItemRequest"
      contentType: application/json
    output:
      $ref: "#/components/schemas/SourceV2ItemResponse"
      contentType: application/json

  get_audio_options_v2:
    description: "Read all version/audio candidates without allocating playback resources. Requires sourceApiVersion=2 and all six v2 exports. Failure must not fall back to legacy source calls."
    input:
      $ref: "#/components/schemas/SourceV2AudioOptionsRequest"
      contentType: application/json
    output:
      $ref: "#/components/schemas/SourceV2AudioOptionsResponse"
      contentType: application/json

  resolve_audio_v2:
    description: "Resolve the requested selection and absolute offset into a transient descriptor. Requires sourceApiVersion=2 and all six v2 exports. Failure must not fall back to legacy source calls."
    input:
      $ref: "#/components/schemas/SourceV2ResolveRequest"
      contentType: application/json
    output:
      $ref: "#/components/schemas/SourceV2ResolveResponse"
      contentType: application/json

  release_audio_v2:
    description: "Release only resources of this attempt and return an affirmative acknowledgement. Requires sourceApiVersion=2 and all six v2 exports. Failure must not fall back to legacy source calls."
    input:
      $ref: "#/components/schemas/SourceV2ReleaseRequest"
      contentType: application/json
    output:
      $ref: "#/components/schemas/SourceV2ReleaseResponse"
      contentType: application/json

imports:
  log:
    description: |
      Write a line to the host's log, prefixed with the extension id.
    input:
      type: string
      contentType: text/plain; charset=utf-8
  query_library:
    description: |
      Run an RSQL filter over the user's tracks and get back the matches.
      Requires the `libraryRead` permission; without it the call returns an
      empty list. Example filter: `genre==rock;year>2000`.
    input:
      $ref: "#/components/schemas/LibraryQuery"
      contentType: application/json
    output:
      type: array
      items:
        $ref: "#/components/schemas/Track"
      contentType: application/json
  query_albums:
    description: |
      Run an RSQL filter over the user's albums. Fields: `title`, `artist`,
      `year`, `cover`. Requires the `libraryRead` permission.
    input:
      $ref: "#/components/schemas/LibraryQuery"
      contentType: application/json
    output:
      type: array
      items:
        $ref: "#/components/schemas/LibraryAlbum"
      contentType: application/json
  query_artists:
    description: |
      Run an RSQL filter over the user's artists. Fields: `name`.
      Requires the `libraryRead` permission.
    input:
      $ref: "#/components/schemas/LibraryQuery"
      contentType: application/json
    output:
      type: array
      items:
        $ref: "#/components/schemas/LibraryArtist"
      contentType: application/json
  query_playlists:
    description: |
      Run an RSQL filter over the user's playlists. Fields: `name`,
      `description`, `smart`, `created`. Requires the `libraryRead` permission.
    input:
      $ref: "#/components/schemas/LibraryQuery"
      contentType: application/json
    output:
      type: array
      items:
        $ref: "#/components/schemas/LibraryPlaylist"
      contentType: application/json
  get_playlist_tracks:
    description: |
      The tracks of one playlist, in order. Requires the `libraryRead`
      permission.
    input:
      type: string
      contentType: text/plain; charset=utf-8
    output:
      type: array
      items:
        $ref: "#/components/schemas/Track"
      contentType: application/json
  get_saved_radios:
    description: |
      The user's bookmarked radio stations. Requires the `libraryRead`
      permission.
    output:
      type: array
      items:
        $ref: "#/components/schemas/SavedRadio"
      contentType: application/json
  get_config:
    description: |
      Read one of the config values declared in `plugin.json`. Returns an empty
      string for a key that was not declared or has no value.
    input:
      type: string
      contentType: text/plain; charset=utf-8
    output:
      type: string
      contentType: text/plain; charset=utf-8

components:
  schemas:
    Track:
      description: A track as an extension sees it — the tags, not the internals.
      properties:
        id:
          type: string
          description: Stable library id.
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        albumArtist:
          type: string
        genre:
          type: string
        year:
          type: integer
          format: int32
          nullable: true
        trackNumber:
          type: integer
          format: int32
          nullable: true
        duration:
          type: number
          format: float
          description: Length in seconds.
        uri:
          type: string
          description: File path or stream url.

    PlayEvent:
      properties:
        type:
          type: string
          description: Always `track_played`.
        track:
          $ref: "#/components/schemas/Track"
        playedAt:
          type: integer
          format: int64
          description: Unix seconds when the play started.
        playCount:
          type: integer
          format: int32
          description: How many times this track has now been played.

    SkipEvent:
      properties:
        type:
          type: string
          description: Always `track_skipped`.
        track:
          $ref: "#/components/schemas/Track"
        skippedAt:
          type: integer
          format: int64

    LikeEvent:
      properties:
        type:
          type: string
          description: Always `track_liked`.
        track:
          $ref: "#/components/schemas/Track"
        liked:
          type: boolean
          description: True when liked, false when the like was removed.

    PlaylistEvent:
      properties:
        type:
          type: string
          description: Always `playlist_created`.
        id:
          type: string
        name:
          type: string
        isSmart:
          type: boolean

    ScanEvent:
      properties:
        type:
          type: string
          description: Always `scan_completed`.
        tracksAdded:
          type: integer
          format: int32
        totalTracks:
          type: integer
          format: int32

    MetadataRequest:
      properties:
        track:
          $ref: "#/components/schemas/Track"

    MetadataResponse:
      description: |
        Every field is optional. Fill in what you know; the host merges answers
        from the enabled providers, first non-empty wins.
      properties:
        lyrics:
          type: string
          nullable: true
          description: Plain text or LRC.
        artworkUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
          description: Artist biography.
        genres:
          type: array
          items:
            type: string
          description: Genre tags this provider would apply.

    CommandSpec:
      properties:
        name:
          type: string
          description: Identifier passed back to `run_command`.
        title:
          type: string
          description: What the UI shows.
        description:
          type: string
        needsTrack:
          type: boolean
          description: Whether the command wants the current track passed in.

    CommandRequest:
      properties:
        name:
          type: string
        track:
          $ref: "#/components/schemas/Track"
          nullable: true
        args:
          type: string
          description: Free-form JSON arguments from the caller.

    CommandResponse:
      properties:
        ok:
          type: boolean
        message:
          type: string
          description: A line to show the user.
        data:
          type: string
          description: Anything structured the caller wants back, as JSON.

    PredicateSpec:
      properties:
        name:
          type: string
          description: The name used in a filter, e.g. `mood` for `ext:mood==chill`.
        description:
          type: string
        values:
          type: array
          items:
            type: string
          description: Example values, shown in a picker.

    PredicateRequest:
      properties:
        name:
          type: string
        op:
          type: string
          description: "The comparison written in the filter: ==, !=, >, >=, <, <=."
        value:
          type: string
        track:
          $ref: "#/components/schemas/Track"

    PredicateResponse:
      properties:
        matches:
          type: boolean

    LibraryQuery:
      properties:
        filter:
          type: string
          description: RSQL over the track fields, e.g. `genre==rock;year>2000`.
        limit:
          type: integer
          format: int32
          description: Maximum rows to return. 0 or absent is unlimited.

    LibraryAlbum:
      description: An album in the user's own library.
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        year:
          type: integer
          format: int32
          nullable: true
        cover:
          type: string
          description: Cover file name, resolvable through the player's cover route.

    LibraryArtist:
      description: An artist in the user's own library.
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string

    LibraryPlaylist:
      description: A playlist in the user's own library.
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        isSmart:
          type: boolean
        trackCount:
          type: integer
          format: int32

    SavedRadio:
      description: A radio station the user has bookmarked.
      properties:
        id:
          type: string
        name:
          type: string
        streamUrl:
          type: string
        source:
          type: string
        genre:
          type: string
        country:
          type: string
        logo:
          type: string
        bitrate:
          type: integer
          format: int32

    SourceInfo:
      description: What kind of media source this extension provides.
      properties:
        name:
          type: string
          description: Shown in the source picker, e.g. "Bandcamp".
        description:
          type: string
        requiresAuth:
          type: boolean
          description: |
            Whether the source needs credentials. Declare the keys it reads
            under `permissions.config` in the manifest.
        supportsSearch:
          type: boolean
          description: Whether the `query` field of a browse request is honoured.

    BrowseRequest:
      properties:
        parentId:
          type: string
          description: |
            List the children of this album, artist or playlist. Empty lists
            everything at the top level.
        query:
          type: string
          description: Free-text search. Empty browses rather than searches.
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
          description: Maximum items to return. 0 or absent means the host's default.

    SourceAlbum:
      properties:
        id:
          type: string
          description: The source's own id, passed back as `parentId`.
        title:
          type: string
        artist:
          type: string
        year:
          type: integer
          format: int32
          nullable: true
        coverUrl:
          type: string

    SourceArtist:
      properties:
        id:
          type: string
        name:
          type: string
        imageUrl:
          type: string

    SourcePlaylist:
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        trackCount:
          type: integer
          format: int32

    StreamRequest:
      properties:
        trackId:
          type: string
          description: The source's own track id.

    StreamResponse:
      properties:
        url:
          type: string
          description: A direct http(s) url the player can decode.
        mimeType:
          type: string
        headers:
          type: string
          description: |
            Extra request headers as a JSON object, for a source that needs an
            Authorization header. Empty when none are needed.

    # Source v2 uses the existing XTP exports/components envelope.
    # GENERATOR VALIDATION PENDING: oneOf tagged unions, required/nullable,
    # additionalProperties, uint32/uint64 and full unsigned bounds are not
    # demonstrated by existing bindings. Do not narrow to int64 or JS Number,
    # stringify ticks, flatten unions, or omit fields to make generation pass.
    # Rust serde DTOs in abi/source_v2.rs define the exact JSON contract.
    SourceV2IdentityRequest:
      type: "object"
      description: "Empty JSON object. Authentication uses extension configuration; identity is returned by the plugin."
      additionalProperties: false
      properties: {}

    SourceV2SourceIdentity:
      type: "object"
      description: "Actual remote server/user pair, checked and bound to a saved account by the host; both must be nonempty."
      additionalProperties: false
      required: ["serverId", "userId"]
      properties:
        serverId:
          type: "string"
        userId:
          type: "string"

    SourceV2BrowseRequest:
      type: "object"
      description: "Parent is a remote item ID, not a host handle. Null/absent parent browses root. Limit must be positive and host bounded; empty query browses."
      additionalProperties: false
      required: ["identity", "offset", "limit"]
      properties:
        identity:
          $ref: "#/components/schemas/SourceV2SourceIdentity"
        parentId:
          type: "string"
          nullable: true
        query:
          type: "string"
          nullable: true
        offset:
          type: "integer"
          format: "uint64"
          minimum: 0
          maximum: 18446744073709551615
        limit:
          type: "integer"
          format: "uint32"
          minimum: 0
          maximum: 4294967295

    SourceV2BrowseResponse:
      type: "object"
      description: "nextOffset is required: null means exhausted, otherwise the checked next raw cursor must advance. Never infer continuation from item count."
      additionalProperties: false
      required: ["items", "nextOffset"]
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/SourceV2MediaItem"
        nextOffset:
          type: "integer"
          format: "uint64"
          minimum: 0
          maximum: 18446744073709551615
          nullable: true

    SourceV2ItemRequest:
      type: "object"
      additionalProperties: false
      required: ["identity", "itemId"]
      properties:
        identity:
          $ref: "#/components/schemas/SourceV2SourceIdentity"
        itemId:
          type: "string"

    SourceV2ItemResponse:
      type: "object"
      additionalProperties: false
      required: ["item"]
      properties:
        item:
          $ref: "#/components/schemas/SourceV2MediaItem"

    SourceV2MediaItem:
      type: "object"
      description: "Persistent metadata only. Original title/type/season/episode must be retained. itemId is remote, never an authoritative source handle. Containers cannot be playable; leaves without audio are not playable. No URL, headers, session, lease or cover transport. runtimeTicks uses 100ns ticks."
      additionalProperties: false
      required: ["itemId", "title", "isContainer", "playable"]
      properties:
        itemId:
          type: "string"
        title:
          type: "string"
        itemType:
          type: "string"
          nullable: true
        mediaType:
          type: "string"
          nullable: true
        isContainer:
          type: "boolean"
        playable:
          type: "boolean"
        seasonNumber:
          type: "integer"
          format: "uint64"
          minimum: 0
          maximum: 18446744073709551615
          nullable: true
        episodeNumber:
          type: "integer"
          format: "uint64"
          minimum: 0
          maximum: 18446744073709551615
          nullable: true
        artist:
          type: "string"
          nullable: true
        album:
          type: "string"
          nullable: true
        albumArtist:
          type: "string"
          nullable: true
        genre:
          type: "string"
          nullable: true
        year:
          type: "integer"
          format: "uint32"
          minimum: 0
          maximum: 4294967295
          nullable: true
        trackNumber:
          type: "integer"
          format: "uint32"
          minimum: 0
          maximum: 4294967295
          nullable: true
        runtimeTicks:
          type: "integer"
          format: "uint64"
          minimum: 0
          maximum: 18446744073709551615
          nullable: true

    SourceV2AudioOptionsRequest:
      type: "object"
      additionalProperties: false
      required: ["identity", "itemId"]
      properties:
        identity:
          $ref: "#/components/schemas/SourceV2SourceIdentity"
        itemId:
          type: "string"

    SourceV2AudioOptionsResponse:
      type: "object"
      description: "Metadata-only: no stream opening or lease allocation. Empty versions/streams are meaningful. Host supplies the authoritative source handle."
      additionalProperties: false
      required: ["itemId", "versions"]
      properties:
        itemId:
          type: "string"
        versions:
          type: "array"
          items:
            $ref: "#/components/schemas/SourceV2AudioVersionOption"

    SourceV2AudioVersionOption:
      type: "object"
      description: "Corresponds to types::audio::AudioVersionOption. Real IDs/indices only, no array renumbering. Invalid/duplicate identities and live/open/close-required versions must be unavailable."
      additionalProperties: false
      required: ["id", "audioStreams"]
      properties:
        id:
          type: "string"
        name:
          type: "string"
          nullable: true
        runtimeTicks:
          type: "integer"
          format: "uint64"
          minimum: 0
          maximum: 18446744073709551615
          nullable: true
        defaultAudioStreamIndex:
          type: "integer"
          format: "int32"
          minimum: -2147483648
          maximum: 2147483647
          nullable: true
        unavailableReason:
          type: "string"
          nullable: true
        audioStreams:
          type: "array"
          items:
            $ref: "#/components/schemas/SourceV2AudioStreamOption"

    SourceV2AudioStreamOption:
      type: "object"
      description: "All shared candidate fields. Preserve index zero and empty language; unavailableReason disables a candidate. Only audio streams. Negative/duplicate indices cannot be selectable."
      additionalProperties: false
      required: ["index", "isDefault"]
      properties:
        index:
          type: "integer"
          format: "int32"
          minimum: -2147483648
          maximum: 2147483647
        title:
          type: "string"
          nullable: true
        displayTitle:
          type: "string"
          nullable: true
        language:
          type: "string"
          nullable: true
        codec:
          type: "string"
          nullable: true
        channels:
          type: "integer"
          format: "uint32"
          minimum: 0
          maximum: 4294967295
          nullable: true
        sampleRate:
          type: "integer"
          format: "uint32"
          minimum: 0
          maximum: 4294967295
          nullable: true
        isDefault:
          type: "boolean"
        unavailableReason:
          type: "string"
          nullable: true

    SourceV2AudioPin:
      type: "object"
      description: "Shared AudioPin evidence in camelCase. Accepted choice belongs to one queue occurrence; IDs must be nonempty and selected index nonnegative. runtimeTicks uses 100ns ticks."
      additionalProperties: false
      required: ["mediaSourceId", "audioStreamIndex"]
      properties:
        mediaSourceId:
          type: "string"
        audioStreamIndex:
          type: "integer"
          format: "int32"
          minimum: -2147483648
          maximum: 2147483647
        runtimeTicks:
          type: "integer"
          format: "uint64"
          minimum: 0
          maximum: 18446744073709551615
          nullable: true
        etag:
          type: "string"
          nullable: true
        codec:
          type: "string"
          nullable: true
        channels:
          type: "integer"
          format: "uint32"
          minimum: 0
          maximum: 4294967295
          nullable: true
        sampleRate:
          type: "integer"
          format: "uint32"
          minimum: 0
          maximum: 4294967295
          nullable: true

    SourceV2SelectionAuto:
      type: "object"
      additionalProperties: false
      required: ["type"]
      properties:
        type:
          type: "string"
          enum: ["auto"]

    SourceV2SelectionExplicit:
      type: "object"
      additionalProperties: false
      required: ["type", "mediaSourceId", "audioStreamIndex"]
      properties:
        type:
          type: "string"
          enum: ["explicit"]
        mediaSourceId:
          type: "string"
        audioStreamIndex:
          type: "integer"
          format: "int32"
          minimum: -2147483648
          maximum: 2147483647

    SourceV2SelectionPinned:
      type: "object"
      additionalProperties: false
      required: ["type", "pin"]
      properties:
        type:
          type: "string"
          enum: ["pinned"]
        pin:
          $ref: "#/components/schemas/SourceV2AudioPin"

    SourceV2AudioSelection:
      description: "Required internally tagged union; no missing/unknown tag fallback to Auto. Explicit index 0 is valid. XTP oneOf generation remains unverified."
      oneOf:
        - $ref: "#/components/schemas/SourceV2SelectionAuto"
        - $ref: "#/components/schemas/SourceV2SelectionExplicit"
        - $ref: "#/components/schemas/SourceV2SelectionPinned"

    SourceV2ResolveRequest:
      type: "object"
      description: "requestId is unique per attempt. formatExts are decoder hints, not MIME types. followRedirects absent means true; false disables redirects. Enabled redirects retain original caller headers including across origins. Expected identity and item are validated before resolution."
      additionalProperties: false
      required: ["requestId", "identity", "itemId", "offsetMs", "selection", "formatExts"]
      properties:
        requestId:
          type: "string"
        identity:
          $ref: "#/components/schemas/SourceV2SourceIdentity"
        itemId:
          type: "string"
        offsetMs:
          type: "integer"
          format: "uint64"
          minimum: 0
          maximum: 18446744073709551615
        selection:
          $ref: "#/components/schemas/SourceV2AudioSelection"
        formatExts:
          type: "array"
          items:
            type: "string"
        followRedirects:
          type: "boolean"
          default: true

    SourceV2HttpHeader:
      type: "object"
      description: "Ordered structured transport header; sensitive, never Debug logged or persisted."
      additionalProperties: false
      required: ["name", "value"]
      properties:
        name:
          type: "string"
        value:
          type: "string"

    SourceV2ResolveResponse:
      type: "object"
      description: "Transient memory-only descriptor, no Debug. Echo requestId/offset exactly. actualPin must be present; null is allowed only for Auto with seekPolicy none. ServerOffset always requires a real pin, independently of timeline, so reopening preserves the selected media and audio track. Explicit/Pinned requests require matching evidence. URL/headers/opaque lease must never enter persistent metadata. formatExt and mimeType are distinct; adapter validates supported format and capability claims."
      additionalProperties: false
      required: ["requestId", "requestedOffsetMs", "url", "headers", "mimeType", "formatExt", "actualPin", "start", "timeline", "seekPolicy", "cachePolicy"]
      properties:
        requestId:
          type: "string"
        requestedOffsetMs:
          type: "integer"
          format: "uint64"
          minimum: 0
          maximum: 18446744073709551615
        url:
          type: "string"
        headers:
          type: "array"
          items:
            $ref: "#/components/schemas/SourceV2HttpHeader"
        mimeType:
          type: "string"
        formatExt:
          type: "string"
        actualPin:
          $ref: "#/components/schemas/SourceV2AudioPin"
          nullable: true
        start:
          $ref: "#/components/schemas/SourceV2StartPosition"
        timeline:
          $ref: "#/components/schemas/SourceV2Timeline"
        seekPolicy:
          $ref: "#/components/schemas/SourceV2SeekPolicy"
        cachePolicy:
          $ref: "#/components/schemas/SourceV2CachePolicy"
        leaseId:
          type: "string"
          nullable: true

    SourceV2StartRequestedOnly:
      type: "object"
      description: "Only requested position known; not evidence of calibrated start."
      additionalProperties: false
      required: ["type"]
      properties:
        type:
          type: "string"
          enum: ["requestedOnly"]

    SourceV2StartCalibrated:
      type: "object"
      description: "Calibrated absolute media start and bounded error in milliseconds; no implicit zero or error tolerance."
      additionalProperties: false
      required: ["type", "offsetMs", "maxErrorMs"]
      properties:
        type:
          type: "string"
          enum: ["calibrated"]
        offsetMs:
          type: "integer"
          format: "uint64"
          minimum: 0
          maximum: 18446744073709551615
        maxErrorMs:
          type: "integer"
          format: "uint64"
          minimum: 0
          maximum: 18446744073709551615

    SourceV2StartPosition:
      oneOf:
        - $ref: "#/components/schemas/SourceV2StartRequestedOnly"
        - $ref: "#/components/schemas/SourceV2StartCalibrated"

    SourceV2TimelineFinite:
      type: "object"
      description: "Finite full program duration in 100ns ticks. Duration is not a completeness witness."
      additionalProperties: false
      required: ["type", "durationTicks"]
      properties:
        type:
          type: "string"
          enum: ["finite"]
        durationTicks:
          type: "integer"
          format: "uint64"
          minimum: 0
          maximum: 18446744073709551615

    SourceV2TimelineLive:
      type: "object"
      additionalProperties: false
      required: ["type"]
      properties:
        type:
          type: "string"
          enum: ["live"]

    SourceV2TimelineUnknown:
      type: "object"
      additionalProperties: false
      required: ["type"]
      properties:
        type:
          type: "string"
          enum: ["unknown"]

    SourceV2Timeline:
      oneOf:
        - $ref: "#/components/schemas/SourceV2TimelineFinite"
        - $ref: "#/components/schemas/SourceV2TimelineLive"
        - $ref: "#/components/schemas/SourceV2TimelineUnknown"

    SourceV2SeekPolicy:
      type: "string"
      enum: ["serverOffset", "none"]
      description: "Only server-offset re-resolution or no seek. No random byte seek capability is implied."

    SourceV2CachePolicy:
      type: "string"
      enum: ["noPersistentCache"]
      description: "Transient transport only; no persistent URL, headers, lease or media cache."

    SourceV2ReleaseRequest:
      type: "object"
      description: "Idempotent attempt-scoped cleanup. requestId works even if resolve never returned a lease. No global account/session cancellation. Sensitive opaque lease: no Debug."
      additionalProperties: false
      required: ["requestId", "identity", "itemId"]
      properties:
        requestId:
          type: "string"
        identity:
          $ref: "#/components/schemas/SourceV2SourceIdentity"
        itemId:
          type: "string"
        leaseId:
          type: "string"
          nullable: true

    SourceV2ReleaseResponse:
      type: "object"
      description: "Nonempty JSON acknowledgement required. Host checks matching requestId and released=true, including already-released attempts. False is failure, not success."
      additionalProperties: false
      required: ["requestId", "released"]
      properties:
        requestId:
          type: "string"
        released:
          type: "boolean"

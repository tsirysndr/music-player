[package]
name = "music-player-mcp"
version = "0.2.1"
edition = "2021"
repository = "https://github.com/tsirysndr/music-player"
license = "MIT"
authors = ["Tsiry Sandratraina <tsiry.sndr@rocksky.app>"]
description = "A Model Context Protocol server for music-player, so an agent can DJ"

[dependencies.music-player-client]
path = "../client"
version = "0.2.1"

[dependencies.music-player-server]
path = "../server"
version = "0.2.1"

[dependencies.music-player-types]
path = "../types"
version = "0.2.1"

[dependencies]
anyhow = "1.0.67"
jsonrpsee-types = "0.26"
serde = { version = "1.0.144", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
tracing = "0.1.37"

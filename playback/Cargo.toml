[package]
authors = ["Tsiry Sandratraina <tsiry.sndr@aol.com>"]
description = "The playback logic for music player"
edition = "2021"
license = "MIT"
name = "music-player-playback"
repository = "https://github.com/tsirysndr/music-player"
version = "0.2.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.music-player-tracklist]
path = "../tracklist"
version = "0.2.1"

[dependencies.music-player-entity]
path = "../entity"
version = "0.2.1"

[dependencies.music-player-settings]
path = "../settings"
version = "0.2.1"

[dependencies]
anyhow = "1.0.67"
async-trait = "0.1.57"
serde = {version = "1.0.145", features = ["derive"]}
serde_json = "1.0.85"
futures-util = "0.3.24"
tracing = "0.1"
rockbox-playback = "0.6.0"
tokio = {version = "1.21.0", features = ["full"]}

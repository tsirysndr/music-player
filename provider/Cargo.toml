[package]
name = "music-player-provider"
version = "0.2.1"
edition = "2021"
repository = "https://github.com/tsirysndr/music-player"
license = "MIT"
authors = ["Tsiry Sandratraina <tsiry.sndr@rocksky.app>"]
description = "The remote music source trait and registry of music player"

[dependencies.music-player-types]
path = "../types"
version = "0.2.1"

[dependencies]
async-trait = "0.1.60"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Kodi speaks JSON-RPC. Only the HTTP client — the ws and wasm clients would
# drag a second transport stack in for nothing.
jsonrpsee = { version = "0.26", default-features = false, features = ["http-client"] }
base64 = "0.22"
urlencoding = "2.1"
serde = { version = "1.0.145", features = ["derive"] }
serde_json = "1.0"
md5 = "0.7.0"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1.37"
url = "2.3.1"

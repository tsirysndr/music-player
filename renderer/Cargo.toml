[package]
name = "music-player-renderer"
version = "0.3.0"
edition = "2021"
repository = "https://github.com/tsirysndr/music-player"
license = "MIT"
authors = ["Tsiry Sandratraina <tsiry.sndr@rocksky.app>"]
description = "Playback receivers (Chromecast, DLNA, peer daemons) for music player"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.music-player-types]
path = "../types"
version = "0.3.0"

[dependencies.music-player-client]
path = "../client"
version = "0.3.0"

[dependencies.music-player-tracklist]
path = "../tracklist"
version = "0.3.0"

[dependencies.music-player-settings]
path = "../settings"
version = "0.3.0"

[dependencies]
async-trait = "0.1.59"
anyhow = "1.0.67"
# rust_cast = { package = "chromecast", version = "0.18.1", git = "https://github.com/tsirysndr/rust-cast.git", rev = "d63aa7f", features = ["thread_safe"] }
url = "2.3.1"
md5 = "0.7.0"
local-ip-addr = "0.1.1"
upnp-client = "0.1.9"
futures = "0.3.26"
tokio = { version = "1.25.0", features = ["time"] }
hyper = { version = "0.14.23", features = ["runtime", "client", "stream", "tcp", "http1", "http2"] }
chromecast = { version = "0.18.2", features = ["thread_safe"] }
futures-util = "0.3.26"
serde = { version = "1.0.144", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.25.0", features = ["rt", "rt-multi-thread", "macros"] }

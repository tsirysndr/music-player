syntax = "proto3";

package metadata.v1alpha1;

message SongArtist {
  string id = 1;
  string name = 2;
}

message Song {
  string id = 1;
  string title = 2;
  repeated SongArtist artists = 4;
  float duration = 5;
  int32 disc_number = 6;
  int32 track_number = 7;
  // The stream url. Without it a client holding an album listing cannot play
  // anything from it, and has to re-fetch every track one by one.
  string uri = 8;
  string album = 9;
  string artist = 10;
}

message Album {
  string id = 1;
  string title = 2;
  string cover = 3;
  string release_date = 4;
  int32 year = 5;
  string artist = 6;
  repeated string genres = 7;
  repeated Song tracks = 8;
}
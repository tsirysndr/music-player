syntax = "proto3";

package metadata.v1alpha1;

import "metadata/v1alpha1/artist.proto";
import "metadata/v1alpha1/album.proto";
import "metadata/v1alpha1/lyrics.proto";

message Track {
  string id = 1;
  string title = 2;
  metadata.v1alpha1.Album album = 3;
  repeated metadata.v1alpha1.Artist artists = 4;
  float duration = 5;
  int32 disc_number = 6;
  int32 track_number = 7;
  metadata.v1alpha1.Lyrics lyrics = 8;
  string uri = 9;
  string artist = 10;
  uint32 bitrate = 11;     // kbps, 0 = unknown
  uint32 sample_rate = 12; // Hz, 0 = unknown
  // Whether the source has it starred/favourited. Absent when the source did
  // not say — which is different from "not liked".
  optional bool liked = 13;
  // Musical key in Camelot notation, e.g. "8A". Camelot rather than "A minor"
  // because adjacent numbers mix, which is why anyone wants to see it.
  //
  // Absent when the track has not been analysed. Only the daemon's own library
  // has these — a remote provider's tracks are not rows it can analyse — which
  // is why clients only offer the column when reading from a music-player.
  optional string key = 14;
  optional float bpm = 15;
}

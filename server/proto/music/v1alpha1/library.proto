syntax = "proto3";

package music.v1alpha1;

import "metadata/v1alpha1/artist.proto";
import "metadata/v1alpha1/album.proto";
import "metadata/v1alpha1/track.proto";

message ScanRequest {}

message ScanResponse {}

message SearchRequest { string query = 1; }

message SearchResponse {
    repeated metadata.v1alpha1.Track tracks = 1;
    repeated metadata.v1alpha1.Album albums = 2;
    repeated metadata.v1alpha1.Artist artists = 3;
}

message GetAlbumsRequest {
    int32 limit = 1;
    int32 offset = 2;
    string filter = 3;
}

message GetAlbumsResponse { repeated metadata.v1alpha1.Album albums = 1; }

message GetArtistsRequest {
    int32 limit = 1;
    int32 offset = 2;
    string filter = 3;
}

message GetArtistsResponse { repeated metadata.v1alpha1.Artist artists = 1; }

message GetTracksRequest {
    int32 limit = 1;
    int32 offset = 2;
    string filter = 3;
}

message GetTracksResponse { repeated metadata.v1alpha1.Track tracks = 1; }

message GetAlbumDetailsRequest {
    string id = 1;
}

message GetAlbumDetailsResponse { metadata.v1alpha1.Album album = 1; }

// The tracks the user has liked.
//
// On a remote provider these are *its* likes — Subsonic's starred songs,
// Jellyfin's favourites. There is no fallback to the local list: those ids
// belong to a different library, so the rows would render but not play.
message GetLikedTracksRequest {
    uint32 offset = 1;
    uint32 limit = 2;
}

message GetLikedTracksResponse {
    repeated metadata.v1alpha1.Track tracks = 1;
}

message GetArtistDetailsRequest {
    string id = 1;
}

message GetArtistDetailsResponse { metadata.v1alpha1.Artist artist = 1; }

message GetTrackDetailsRequest {
    string id = 1;
}

message GetTrackDetailsResponse { metadata.v1alpha1.Track track = 1; }

// Like/unlike a track. The like itself lives with the client; the daemon
// forwards it to Rocksky (no-op without a `rocksky login` token).
message LikeTrackRequest {
  string id = 1;
  bool like = 2;
}

message LikeTrackResponse {}

// Account-labelled navigation; media containers are not playable tracks.
message MediaBrowser {
  string server_id = 1;
  bool supported = 2;
}
message MediaEntry {
  string id = 1;
  string title = 2;
  optional string item_type = 3;
  optional string media_type = 4;
  bool is_container = 5;
  optional uint64 season_number = 6;
  optional uint64 episode_number = 7;
  metadata.v1alpha1.Track track = 8;
}
message GetMediaBrowserRequest {}
message GetMediaBrowserResponse { MediaBrowser browser = 1; }
message BrowseMediaRequest {
  string server_id = 1;
  optional string parent = 2;
  int32 offset = 3;
  // Absent means 100; otherwise must be from 1 to 500.
  optional int32 limit = 4;
}
message BrowseMediaResponse {
  string server_id = 1;
  repeated MediaEntry entries = 2;
  optional int32 next_offset = 3;
}
message GetMediaContainerTracksRequest {
  string server_id = 1;
  string parent = 2;
  int32 offset = 3;
  // Absent means 100; <= 0 expands every leaf, all or error.
  optional int32 limit = 4;
}
message GetMediaContainerTracksResponse {
  string server_id = 1;
  repeated metadata.v1alpha1.Track tracks = 2;
}

// Candidate metadata only: showing choices does not start a playback session.
message GetMediaAudioOptionsRequest {
  // Stable source handle, including the saved account; never a bare item id.
  string source = 1;
}
message AudioStreamOption {
  int32 index = 1;
  optional string title = 2;
  optional string display_title = 3;
  optional string language = 4;
  optional string codec = 5;
  optional uint32 channels = 6;
  optional uint32 sample_rate = 7;
  bool is_default = 8;
  optional string unavailable_reason = 9;
}
message AudioVersionOption {
  string id = 1;
  optional string name = 2;
  optional uint64 runtime_ticks = 3;
  optional int32 default_audio_stream_index = 4;
  optional string unavailable_reason = 5;
  repeated AudioStreamOption audio_streams = 6;
}
message GetMediaAudioOptionsResponse {
  string source = 1;
  repeated AudioVersionOption versions = 2;
}

service LibraryService {
  rpc GetMediaAudioOptions(GetMediaAudioOptionsRequest)
      returns (GetMediaAudioOptionsResponse) {}
  rpc GetMediaBrowser(GetMediaBrowserRequest) returns (GetMediaBrowserResponse) {}
  rpc BrowseMedia(BrowseMediaRequest) returns (BrowseMediaResponse) {}
  rpc GetMediaContainerTracks(GetMediaContainerTracksRequest)
      returns (GetMediaContainerTracksResponse) {}
  rpc LikeTrack(LikeTrackRequest) returns (LikeTrackResponse) {}
  rpc Scan(ScanRequest) returns (ScanResponse) {}
  rpc Search(SearchRequest) returns (SearchResponse) {}
  rpc GetAlbums(GetAlbumsRequest) returns (GetAlbumsResponse) {}
  rpc GetAlbumDetails(GetAlbumDetailsRequest)
      returns (GetAlbumDetailsResponse) {}
  rpc GetTracks(GetTracksRequest) returns (GetTracksResponse) {}
  rpc GetLikedTracks(GetLikedTracksRequest) returns (GetLikedTracksResponse) {}
  rpc GetTrackDetails(GetTrackDetailsRequest)
      returns (GetTrackDetailsResponse) {}
  rpc GetArtists(GetArtistsRequest) returns (GetArtistsResponse) {}
  rpc GetArtistDetails(GetArtistDetailsRequest)
      returns (GetArtistDetailsResponse) {}
}

[package]
name = "music-player-storage"
version = "0.2.1"
edition = "2021"
repository = "https://github.com/tsirysndr/music-player"
license = "MIT"
authors = ["Tsiry Sandratraina <tsiry.sndr@rocksky.app>"]
description = " The storage module of music player"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.music-player-settings]
path = "../settings"
version = "0.2.1"

[dependencies.music-player-types]
path = "../types"
version = "0.2.1"

[dependencies.music-player-entity]
path = "../entity"
version = "0.2.1"

[dependencies]
itertools = "0.10.5"
dirs = "4.0.0"
reqwest = {version = "0.12", default-features = false, features = ["rustls-tls", "json"]}
sha2 = "0.10"
serde = {version = "1.0.145", features = ["derive"]}
serde_json = "1.0.85"
tracing = "0.1"
sea-orm = { version = "0.9.2", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
md5 = "0.7.0"
tokio = { version = "1.22.0", features = ["test-util", "macros"] }
anyhow = "1.0.68"
chrono = "0.4.23"
atradio-sdk = "0.1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
base64 = "0.22"
directories = "5"
futures-util = "0.3"
serde_ipld_dagcbor = "0.7.0"
cid = "0.11.3"
ipld-core = "0.4"

[dev-dependencies.music-player-migration]
path = "../migration"
version = "0.2.1"

[dev-dependencies]
tempfile = "3.3.0"

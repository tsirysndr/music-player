[package]
name = "music-player-tracklist"
version = "0.4.6-rc.1"
edition = "2021"
repository = "https://github.com/tsirysndr/music-player"
license = "MIT"
authors = ["Tsiry Sandratraina <tsiry.sndr@rocksky.app>"]
keywords = ["tokio", "music", "cli", "daemon", "streaming"]
description = "The tracklist manager for the music player"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.music-player-entity]
path = "../entity"
version = "0.4.6-rc.1"

[dependencies]
music-player-types = { path = "../types", version = "0.4.6-rc.1" }
serde = { version = "1.0.145", features = ["derive"] }
uuid = { version = "1.2.1", features = ["v4"] }
atlist-rs = "0.2.1"
rand = "0.8.5"

[dev-dependencies]
serde_json = "1.0.85"

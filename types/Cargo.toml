[package]
authors = ["Tsiry Sandratraina <tsiry.sndr@aol.com>"]
description = "The types module of music player"
edition = "2021"
license = "MIT"
name = "music-player-types"
repository = "https://github.com/tsirysndr/music-player"
version = "0.1.6"

[dependencies.music-player-discovery]
path = "../discovery"
version = "0.1.2"

[dependencies.music-player-settings]
path = "../settings"
version = "0.1.3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
local-ip-addr = "0.1.1"
lofty = "0.9.0"
md5 = "0.7.0"
mdns-sd = "0.5.9"
minreq = {version = "2.6.0"}
serde = {version = "1.0.208", features = ["serde_derive", "derive"]}
tantivy = "0.19.2"
upnp-client = "0.1.9"
url = "2.3.1"
